<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>選手列表｜Jabari 巴西柔術館內賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">Jabari<span></span></a>
    <nav class="nav">
      <a href="index.html">介紹</a>
      <a href="register.html">報名</a>
      <a href="athletes.html" class="is-active">選手列表</a>
      <a href="edit.html">修改資料</a>
    </nav>
  </header>

  <main class="page page-wide">
    <div class="page-intro">
      <h1>已報名選手</h1>
      <p>目前已送出報名的選手名單（不顯示聯絡資料）。</p>
    </div>

    <div class="list-toolbar">
      <label class="filter-label">
        組別篩選
        <select id="category-filter">
          <option value="all">全部</option>
          <option value="adult">成人組</option>
          <option value="child">兒童組</option>
        </select>
      </label>
      <p class="list-count" id="list-count">載入中…</p>
    </div>

    <p class="field-error" id="list-error" hidden></p>

    <div class="table-wrap">
      <table class="athletes-table" id="athletes-table">
        <thead>
          <tr>
            <th>#</th>
            <th>姓名</th>
            <th>組別</th>
            <th>年齡區間</th>
            <th>體重級別</th>
          </tr>
        </thead>
        <tbody id="athletes-body">
          <tr>
            <td colspan="5">載入中…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <p>Jabari 巴西柔術館內賽 · 報名資料僅供活動聯繫使用</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/athletes.js"></script>
</body>
</html>
